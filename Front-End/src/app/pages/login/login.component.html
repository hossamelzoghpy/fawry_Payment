<div class="min-h-screen bg-gradient-to-br from-blue-600 to-blue-900 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-10">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4">
        <span class="text-white text-3xl">💳</span>
      </div>
      <h1 class="text-3xl font-bold text-gray-800">Fawry Payment</h1>
      <p class="text-gray-400 mt-1">Sign in to your account</p>
    </div>

    <!-- Error -->

    @if (errorMessage != '') {
    <div class="bg-red-50 border border-red-200 text-red-600 p-3 rounded-xl mb-6 text-center text-sm">
      {{ errorMessage }}
    </div>  
    }


    <!-- Form -->
    <form (ngSubmit)="onLogin()">
      <div class="mb-5">
        <label class="block text-gray-600 text-sm font-medium mb-2">Username</label>
        <input type="text" [(ngModel)]="username" name="username" required
          placeholder="Enter your username"
          class="w-full border border-gray-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-gray-50"/>
      </div>

      <div class="mb-8">
        <label class="block text-gray-600 text-sm font-medium mb-2">Password</label>
        <input type="password" [(ngModel)]="password" name="password" required
          placeholder="Enter your password"
          class="w-full border border-gray-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-gray-50"/>
      </div>

      <button type="submit" [disabled]="isLoading()"
        class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition disabled:opacity-50 flex items-center justify-center gap-2">
        @if (isLoading()) {
          <span class="flex items-center gap-2">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Signing in...
          </span>
        } @else {
          <span>Sign In →</span>
        }
      </button>
    </form>

  </div>
</div>
