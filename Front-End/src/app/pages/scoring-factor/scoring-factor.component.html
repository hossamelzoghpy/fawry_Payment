<div>
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Scoring Factor Config</h2>
    <button (click)="openModal()"
      class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition">
      + Add Factor
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading()" class="text-center text-gray-500 py-10">Loading...</div>

  <!-- Table -->
  <div *ngIf="!isLoading()" class="bg-white rounded-2xl shadow overflow-hidden">
    <table class="w-full text-left">
      <thead class="bg-blue-600 text-white">
        <tr>
          <th class="px-6 py-4">Code</th>
          <th class="px-6 py-4">Weight</th>
          <th class="px-6 py-4">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of factors" class="border-b hover:bg-gray-50 transition">
          <td class="px-6 py-4 font-medium">{{ item.code }}</td>
          <td class="px-6 py-4">{{ item.weight }}</td>
          <td class="px-6 py-4 flex gap-3">
            <button (click)="openModal(item)" class="text-blue-600 hover:underline font-medium">Edit</button>
            <button (click)="deleteItem(item.code)" class="text-red-500 hover:underline font-medium">Delete</button>
          </td>
        </tr>
        <tr *ngIf="factors.length === 0">
          <td colspan="3" class="text-center py-10 text-gray-400">No factors found</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div *ngIf="showModal()"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md mx-4">

    <div class="flex justify-between items-center mb-6">
      <h3 class="text-xl font-bold text-gray-800">
        {{ isEditMode() ? 'Edit Factor' : 'Add Factor' }}
      </h3>
      <button (click)="closeModal()"
        class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Code</label>
        <input type="text" [(ngModel)]="dto.code" name="code" required
          [readonly]="isEditMode()"
          [class]="isEditMode() ? 'w-full border border-gray-200 rounded-lg p-3 bg-gray-100 text-gray-500 cursor-not-allowed' : 'w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500'"
          placeholder="e.g. COMMISSION"/>
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 mb-2">Weight</label>
        <input type="number" [(ngModel)]="dto.weight" name="weight" required
          step="0.01" min="0" max="1"
          placeholder="e.g. 0.4"
          class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <div class="flex gap-4">
        <button type="submit" [disabled]="isLoading()"
          class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition disabled:opacity-50">
          {{ isLoading() ? 'Saving...' : (isEditMode() ? 'Update' : 'Add') }}
        </button>
        <button type="button" (click)="closeModal()"
          class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition">
          Cancel
        </button>
      </div>
    </form>

  </div>
</div>
