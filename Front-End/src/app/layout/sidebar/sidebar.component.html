<div class="flex flex-col h-screen w-64 bg-gradient-to-b from-blue-700 to-blue-900 text-white p-6 fixed shadow-xl">

  <!-- Logo -->
  <div class="mb-8">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white bg-opacity-20 rounded-xl flex items-center justify-center">
        <span class="text-xl">💳</span>
      </div>
      <div>
        <h1 class="text-lg font-bold leading-tight">Fawry</h1>
        <p class="text-blue-200 text-xs">Payment System</p>
      </div>
    </div>
  </div>

  <!-- User Info -->
  <div class="mb-6 pb-4 border-b border-white border-opacity-20">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
        @if (isAdmin()) {
          <span class="text-lg">👨‍💼</span>
        } @else {
          <span class="text-lg">👤</span>
        }
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold truncate">{{ username() }}</p>
        <p class="text-xs text-blue-200 capitalize">{{ userRole() }}</p>
      </div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="flex flex-col gap-2 flex-1 overflow-y-auto">
    
    <!-- Admin-only Links -->
    @if (isAdmin()) {
      <a routerLink="/gateways" routerLinkActive="bg-white bg-opacity-20"
         class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white hover:bg-opacity-10 transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span class="font-medium">Gateways</span>
      </a>
      
      <a routerLink="/availability" routerLinkActive="bg-white bg-opacity-20"
         class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white hover:bg-opacity-10 transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="font-medium">Availability</span>
      </a>
      
      <a routerLink="/scoring-factor" routerLinkActive="bg-white bg-opacity-20"
         class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white hover:bg-opacity-10 transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 27 27">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="font-medium">Scoring Factor</span>
      </a>
    }

    <!-- User/Biller Links -->
    @if (isUser()) {
      <a routerLink="/transactions" routerLinkActive="bg-white bg-opacity-20"
         class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white hover:bg-opacity-10 transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        <span class="font-medium">Transactions</span>
      </a>
      
      <a routerLink="/recommend" routerLinkActive="bg-white bg-opacity-20"
         class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white hover:bg-opacity-10 transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        <span class="font-medium">Recommend Gateway</span>
      </a>
      <a routerLink="/split-txn" routerLinkActive="bg-white bg-opacity-20"
         class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white hover:bg-opacity-10 transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        <span class="font-medium">Spliting Amount</span>
      </a>
    }

  </nav>

  <!-- Logout -->
  <button (click)="logout()"
    class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-red-500 hover:bg-opacity-80 transition mt-4 border border-white border-opacity-20 group">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
    </svg>
    <span class="font-medium">Logout</span>
  </button>

</div>
